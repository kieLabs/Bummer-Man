<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#07111f" />
  <meta name="description" content="Bummer Man 2D: Unlimited Arena — blast through endless themed arenas, outsmart enemies, collect power-ups and unlock hero skins." />
  <title>Bummer Man 2D: Unlimited Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    :root{color-scheme:dark;--ink:#f5f5f5;--muted:#c5c5c5;--line:rgba(255,255,255,.22);--glass:#101010;--cyan:#20dce5;--pink:#ff8b36;--gold:#ffd05a}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:#171717;color:var(--ink);font-family:ui-monospace,Consolas,monospace;overscroll-behavior:none}
    body{background:#171717;min-height:100dvh}
    button{font:inherit;cursor:pointer;touch-action:manipulation}
    button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
    #app{width:min(1120px,100%);margin:0 auto;padding:clamp(8px,2vw,18px);padding-bottom:max(12px,env(safe-area-inset-bottom))}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:3px;background:#087f87;border:3px solid #e5e5e5;box-shadow:3px 3px 0 #050505;font-size:22px}
    .brand h1{font-size:clamp(15px,2.3vw,21px);font-weight:950;letter-spacing:.045em;line-height:1.08;margin:0;white-space:nowrap}
    .brand p{font-size:10px;color:#83a2bd;letter-spacing:.2em;text-transform:uppercase;margin:4px 0 0}
    .top-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
    .icon-btn{min-width:38px;height:37px;padding:0 10px;border-radius:11px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(25,47,70,.88),rgba(9,22,39,.88));color:#d7e9fa;font-size:16px;box-shadow:0 5px 14px rgba(0,0,0,.18);transition:transform .14s,border-color .14s,background .14s}
    .icon-btn:active,.action-btn:active{transform:scale(.96)}
    .icon-btn:hover{border-color:rgba(85,231,255,.5);background:#15344d}
    .hud{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin-bottom:10px}
    .hud-card{min-width:0;padding:8px 10px;border:2px solid #bdbdbd;border-radius:2px;background:#252525;box-shadow:3px 3px 0 #050505}
    .hud-label{display:block;font-size:9px;line-height:1.3;color:#829bb5;text-transform:uppercase;letter-spacing:.13em;white-space:nowrap}
    .hud-value{display:block;font-size:clamp(12px,2vw,17px);font-weight:850;color:#f2f8ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;font-variant-numeric:tabular-nums}
    .hud-value.theme{font-size:clamp(10px,1.5vw,13px);padding-top:2px}
    .game-shell{position:relative;overflow:hidden;border-radius:2px;border:4px solid #bdbdbd;background:#087f87;box-shadow:0 0 0 4px #050505,0 12px 28px rgba(0,0,0,.45)}
    .canvas-wrap{position:relative;width:100%;line-height:0;background:#087f87;aspect-ratio:var(--arena-ratio,1.1818)}
    canvas{display:block;width:100%;height:auto;touch-action:none}
    .touch-controls{position:absolute;inset:auto 0 0 0;display:none;justify-content:space-between;align-items:flex-end;padding:12px 14px calc(12px + env(safe-area-inset-bottom));pointer-events:none;z-index:5}
    .touch-controls.visible{display:flex}
    .stick-zone{width:126px;height:126px;border-radius:50%;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.55);box-shadow:0 8px 25px rgba(0,0,0,.2);position:relative;pointer-events:auto;touch-action:none;backdrop-filter:blur(5px)}
    .stick-zone:before{content:"";position:absolute;inset:19px;border:1px dashed rgba(169,217,240,.25);border-radius:50%}
    .stick-knob{position:absolute;width:48px;height:48px;left:50%;top:50%;margin:-24px 0 0 -24px;border-radius:50%;background:linear-gradient(145deg,#f4f4f4,#777);border:2px solid #111;box-shadow:0 5px 16px rgba(0,0,0,.38),0 0 20px rgba(63,220,255,.26);pointer-events:none}
    .bomb-touch{pointer-events:auto;width:88px;height:88px;border-radius:50%;border:3px solid rgba(255,255,255,.72);background:radial-gradient(circle at 32% 25%,#ffb15e 0%,#e52d21 45%,#8c1111 85%);box-shadow:0 8px 0 #620d24,0 12px 24px rgba(0,0,0,.35),0 0 22px rgba(255,52,83,.35);color:white;font-size:27px;font-weight:900;text-shadow:0 2px 4px #650b1e;touch-action:manipulation}
    .bomb-touch:active{transform:translateY(5px);box-shadow:0 3px 0 #620d24,0 6px 12px rgba(0,0,0,.3)}
    #gameShell:fullscreen{width:min(100vw,calc(100dvh * 780 / 660));height:100dvh;max-height:100dvh;display:flex;align-items:center;justify-content:center;border-radius:0}
    #gameShell:fullscreen .canvas-wrap{width:min(100vw,calc(100dvh * 780 / 660));height:auto;aspect-ratio:780/660}
    #gameShell:fullscreen .canvas-wrap canvas{width:100%;height:auto}
    .overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:clamp(10px,2vw,22px);background:rgba(3,9,17,.90);backdrop-filter:blur(12px);line-height:normal}
    .overlay.show{display:flex}
    .panel{width:min(510px,100%);max-height:92%;overflow:auto;border:4px solid #e5e5e5;border-radius:2px;padding:clamp(17px,4vw,25px);background:#151515;box-shadow:6px 6px 0 #050505;text-align:center}
    .eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#6eddf4;font-weight:800}
    .panel h2{font-size:clamp(23px,4.7vw,35px);font-weight:950;letter-spacing:-.035em;line-height:1.05;margin:7px 0 9px;color:#f5fbff}
    .panel-copy{color:#a5bdd2;font-size:13px;line-height:1.55;max-width:420px;margin:0 auto 17px}
    .action-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:43px;padding:0 17px;border-radius:12px;border:1px solid rgba(110,223,245,.48);background:linear-gradient(135deg,#2cbed3,#147f9d);color:#04121e;font-size:13px;font-weight:900;box-shadow:0 7px 20px rgba(27,178,207,.19);transition:transform .14s,filter .14s;}
    .action-btn:hover{filter:brightness(1.1)}
    .action-btn.secondary{background:linear-gradient(145deg,#1b344e,#10243a);border-color:rgba(156,193,222,.22);color:#e1effb;box-shadow:none}
    .action-btn.danger{background:linear-gradient(135deg,#ff6573,#b51e3e);border-color:rgba(255,174,179,.45);color:white}
    .action-btn.gold{background:linear-gradient(135deg,#ffd27d,#c8862d);border-color:#ffdb9b;color:#241505}
    .action-btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
    .menu-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:12px}
    .mini-stats{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:15px 0;color:#92aabe;font-size:11px}
    .mini-stats strong{color:#edf7ff}
    .control-help{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:10px;color:#7f9ab2;margin-top:12px}
    .skin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;text-align:left;margin:14px 0}
    .skin-card{padding:11px;border:1px solid rgba(153,192,220,.17);border-radius:13px;background:rgba(5,17,30,.58);min-width:0}
    .skin-top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
    .skin-avatar{width:39px;height:39px;flex:0 0 39px;border-radius:12px;display:grid;place-items:center;font-size:22px;border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 0 14px rgba(255,255,255,.12)}
    .skin-name{font-size:11px;font-weight:850;line-height:1.25;color:#edf8ff}
    .skin-mile{font-size:9px;color:#86a3bc;margin-top:3px}
    .skin-card .action-btn{width:100%;min-height:32px;padding:0 7px;font-size:10px;border-radius:9px}
    .ad-box{margin:16px 0 14px;padding:15px;border:1px solid rgba(255,207,123,.24);border-radius:14px;background:linear-gradient(145deg,rgba(92,58,20,.24),rgba(12,21,34,.65))}
    .ad-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#ffd28a;font-weight:800}
    .ad-count{font-size:36px;font-weight:950;color:#fff1d3;margin:5px 0 10px;font-variant-numeric:tabular-nums}
    .ad-track{height:8px;background:rgba(255,255,255,.12);border-radius:20px;overflow:hidden}
    .ad-progress{height:100%;width:0;background:linear-gradient(90deg,#ffc35f,#fff0ae);border-radius:20px;box-shadow:0 0 15px rgba(255,193,80,.4)}
    .ad-foot{font-size:10px;color:#aa9d89;margin-top:9px}
    .status-line{font-size:11px;color:#83a1b9;margin-top:10px;min-height:16px}
    .bottom-note{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 3px 0;color:#6f8ba5;font-size:10px}
    .bottom-note strong{color:#a9c9df;font-weight:700}
    .hidden{display:none!important}
    #app.home-mode .hud,#app.home-mode .bottom-note{display:none!important}
    /* New home hub, theme library and level browser */
    .home-panel{width:min(820px,100%);max-height:calc(100dvh - 28px);overflow:auto;overscroll-behavior:contain;text-align:left;background:linear-gradient(145deg,rgba(16,34,52,.97),rgba(7,17,29,.98));border:1px solid rgba(149,208,238,.28);border-radius:24px;padding:clamp(16px,3vw,26px);box-shadow:0 24px 80px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.09)}
    .home-hero{display:grid;grid-template-columns:1fr 190px;gap:16px;align-items:center}
    .home-title{font:950 clamp(27px,5vw,48px)/.95 system-ui,sans-serif;letter-spacing:-.055em;margin:8px 0;color:#f5fbff}
    .home-title span{color:#7de2da}
    .home-sub{font:500 13px/1.55 system-ui,sans-serif;color:#a9c4d7;max-width:430px;margin:10px 0 13px}
    .home-art{height:150px;border-radius:19px;border:1px solid rgba(255,255,255,.15);background:radial-gradient(circle at 50% 32%,rgba(95,225,218,.24),transparent 55%),linear-gradient(145deg,#173c4d,#0a1728);display:grid;place-items:center;font-size:76px;position:relative;overflow:hidden}
    .home-art:after{content:"";position:absolute;inset:auto 12% 16px;height:18px;border-radius:50%;background:#0008;filter:blur(8px)}
    .home-stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
    .home-stat{padding:9px 12px;border-radius:12px;background:#ffffff0b;border:1px solid #ffffff16;font:700 10px system-ui,sans-serif;color:#9bb7c9}
    .home-stat b{color:white;font-size:13px;margin-left:5px}
    .home-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:13px}
    .home-actions .action-btn{min-height:46px;border-radius:13px;font:850 12px system-ui,sans-serif}
    .home-actions .primary{grid-column:span 3;min-height:54px;font-size:15px;background:linear-gradient(135deg,#8bf0df,#2cb8bb);color:#06202a}
    .library-panel{width:min(920px,100%);height:min(92dvh,900px);max-height:calc(100dvh - 24px);text-align:left;background:linear-gradient(145deg,#12273a,#091522);border:1px solid #9cc6df3d;border-radius:20px;padding:17px;overflow:hidden;display:flex;flex-direction:column}
    .library-scroll{overflow:auto;min-height:0;padding:3px 3px 12px;overscroll-behavior:contain}
    .library-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
    .library-head h2{font:900 clamp(22px,4vw,30px) system-ui,sans-serif;margin:3px 0}
    .library-head p{font:11px system-ui,sans-serif;color:#9cb5c7;margin:4px 0}
    .library-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .theme-card{min-width:0;display:grid;grid-template-columns:66px 1fr;align-items:center;gap:9px;padding:8px;border-radius:13px;border:1px solid #ffffff1b;background:#071523aa}
    .theme-preview{height:58px;border-radius:9px;border:1px solid #ffffff35;position:relative;overflow:hidden;box-shadow:inset 0 0 18px #0004}
    .theme-preview:before{content:"";position:absolute;left:8px;top:8px;width:22px;height:22px;background:#ffffff35;border:2px solid #ffffff75;box-shadow:27px 14px 0 -3px #0006,27px 14px 0 0 #ffffff55}
    .theme-preview:after{content:"";position:absolute;right:8px;bottom:7px;width:20px;height:20px;border-radius:50%;background:#ffffff45;box-shadow:0 0 12px #ffffff70}
    .theme-name{font:800 11px/1.2 system-ui,sans-serif;color:#f1f8fc}
    .theme-type{font:9px system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:#89aabe;margin-top:4px}
    .theme-card .action-btn{grid-column:1/-1;width:100%;min-height:30px;padding:0 8px;border-radius:8px;font-size:10px}
    .library-section{font:800 11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.15em;color:#88dcd6;margin:14px 2px 8px}
    .level-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0}
    .level-tile{min-height:48px;border-radius:11px;border:1px solid #ffffff24;background:#10283a;color:#f3fbff;font:900 14px system-ui,sans-serif}
    .level-tile.locked{opacity:.34;filter:grayscale(1)}
    .settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px;border-bottom:1px solid #ffffff12;font:700 12px system-ui,sans-serif;color:#d8e8f2}
    #app:fullscreen{width:100vw;height:100dvh;max-width:none;margin:0;padding:5px 8px;display:flex;flex-direction:column;overflow:hidden;background:#07111d}
    #app:fullscreen .topline{margin-bottom:4px;flex:0 0 auto}
    #app:fullscreen .hud{margin-bottom:5px;flex:0 0 auto}
    #app:fullscreen .game-shell{flex:1;min-height:0;display:grid;place-items:center;width:100%;margin:0;border-radius:10px}
    #app:fullscreen .canvas-wrap{width:min(100vw,calc((100dvh - 86px)*var(--arena-ratio,1.1818)));height:auto;aspect-ratio:var(--arena-ratio,1.1818)}
    #app:fullscreen .canvas-wrap canvas{width:100%;height:auto}
    #app:fullscreen .touch-controls{padding:5px 12px}
    #app:fullscreen .stick-zone{width:90px;height:90px}
    #app:fullscreen .bomb-touch{width:68px;height:68px}
    #app:fullscreen .bottom-note{padding-top:3px;flex:0 0 auto}
    #fullscreenExit,#landscapeHome{display:none}
    @media screen and (max-width:1100px) and (max-height:650px) and (orientation:landscape){#app:fullscreen{display:block;padding:0}#app:fullscreen .topline,#app:fullscreen .hud,#app:fullscreen .bottom-note{display:none!important}#app:fullscreen .game-shell{position:absolute;inset:0;width:100%;height:100%;margin:0;border:0;border-radius:0;box-shadow:none}#app:fullscreen .canvas-wrap{width:100%;height:100%;aspect-ratio:auto}#app:fullscreen .canvas-wrap canvas{width:100%;height:100%}#app:fullscreen .touch-controls{padding:8px 15px}#fullscreenExit,#landscapeHome{display:grid;place-items:center;position:fixed;top:8px;z-index:55;background:#0b1b2dcc;border-color:#ffffff55;color:#fff;min-width:34px;width:34px;height:34px;padding:0;font-size:14px}#fullscreenExit{right:8px}#landscapeHome{left:8px}}
    @media(max-height:520px) and (orientation:landscape){#app:fullscreen .game-shell{width:100%;}#app:fullscreen .canvas-wrap{width:min(calc(100vw - 10px),calc((100dvh - 80px)*var(--arena-ratio,1.1818)));}}
    @media screen and (max-width:1100px) and (max-height:650px) and (orientation:landscape){#app:fullscreen .canvas-wrap{width:100%!important;height:100%;aspect-ratio:auto}#app:fullscreen .canvas-wrap canvas{width:100%;height:100%}}
    @media(max-width:540px){.home-hero{grid-template-columns:1fr 112px;gap:9px}.home-panel{padding:14px;border-radius:18px}.home-title{font-size:clamp(26px,8vw,36px)}.home-sub{font-size:12px;margin:6px 0 9px}.home-art{height:100px;font-size:51px}.home-stats{margin:9px 0}.home-stat{padding:7px 9px}.home-actions{gap:7px;margin-top:8px}.home-actions .action-btn{min-height:40px}.home-actions .primary{min-height:48px}.control-help{margin-top:8px}.home-art{height:115px;font-size:56px}.home-actions{grid-template-columns:repeat(2,minmax(0,1fr))}.home-actions .primary{grid-column:span 2}.theme-card{grid-template-columns:54px 1fr;gap:7px;padding:7px}.theme-preview{height:50px}.theme-name{font-size:10px}.level-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:760px){
      #app{padding:8px 7px 12px}.topline{align-items:flex-start;margin-bottom:8px}.brand-mark{width:35px;height:35px;border-radius:10px;font-size:18px}.brand h1{font-size:14px}.brand p{font-size:8px;letter-spacing:.15em}.top-actions{gap:4px;max-width:58%}.icon-btn{height:32px;min-width:34px;padding:0 8px;border-radius:9px;font-size:14px}.hud{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-bottom:7px}.hud-card{padding:6px 8px;border-radius:9px}.hud-label{font-size:8px}.hud-value{font-size:13px}.hud-value.theme{font-size:10px}.game-shell{border-radius:12px}.overlay{padding:8px}.panel{border-radius:15px;padding:16px}.panel-copy{font-size:12px}.bottom-note{font-size:9px}.stick-zone{width:112px;height:112px}.bomb-touch{width:76px;height:76px;font-size:24px}
    }
    @media(max-height:520px) and (orientation:landscape){
      #app{padding:5px 8px}.topline{margin-bottom:5px}.brand-mark{width:30px;height:30px}.brand h1{font-size:13px}.brand p{display:none}.icon-btn{height:29px;min-width:31px}.hud{grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-bottom:5px}.hud-card{padding:4px 6px}.hud-label{font-size:7px}.hud-value{font-size:11px}.game-shell{width:min(calc((100dvh - 116px)*var(--arena-ratio,1.1818)),calc(100vw - 16px));max-height:none;margin:0 auto}.canvas-wrap{height:auto;width:100%;aspect-ratio:var(--arena-ratio,1.1818)}.canvas-wrap canvas{height:auto;width:100%;object-fit:contain}.touch-controls{padding:6px 10px}.stick-zone{width:88px;height:88px}.stick-knob{width:38px;height:38px;margin:-19px 0 0 -19px}.bomb-touch{width:64px;height:64px}.bottom-note{padding-top:5px}
    }
  </style>
</head>
<body>
<div id="app" class="min-h-screen select-none">
  <header class="topline flex items-center justify-between">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">💣</div>
      <div><h1>BUMMER MAN <span style="color:#5de5fa">2D</span></h1><p>UNLIMITED ARENA · GAMERKIE</p></div>
    </div>
    <nav class="top-actions flex flex-wrap" aria-label="Game actions">
      <button class="icon-btn" id="themesBtn" title="Theme universe" aria-label="Theme universe">🌍</button>
      <button class="icon-btn" id="skinsBtn" title="Hero skins vault" aria-label="Hero skins vault">🦸</button>
      <button class="icon-btn" id="zoomBtn" title="Toggle camera zoom" aria-label="Toggle camera zoom">🔍</button>
      <button class="icon-btn" id="soundBtn" title="Toggle sound" aria-label="Toggle sound">🔊</button>
      <button class="icon-btn" id="fullscreenBtn" title="Fullscreen" aria-label="Fullscreen">⛶</button>
      <button class="icon-btn" id="shareBtn" title="Share game" aria-label="Share game">📤</button>
      <button class="icon-btn" id="pauseBtn" title="Pause" aria-label="Pause">⏸</button>
      <button class="icon-btn" id="exitBtn" title="Exit to main menu" aria-label="Exit to main menu">🚪</button>
    </nav>
  </header>

  <section class="hud grid" aria-label="Game status">
    <div class="hud-card min-w-0"><span class="hud-label block tracking-widest">Level</span><span class="hud-value" id="hudLevel">1</span></div>
    <div class="hud-card min-w-0"><span class="hud-label block tracking-widest">Arena theme</span><span class="hud-value theme" id="hudTheme">Cyber Neon City</span></div>
    <div class="hud-card min-w-0"><span class="hud-label block tracking-widest">Lives</span><span class="hud-value" id="hudLives">❤️❤️❤️</span></div>
    <div class="hud-card min-w-0"><span class="hud-label block tracking-widest">Score</span><span class="hud-value" id="hudScore">0</span></div>
    <div class="hud-card min-w-0"><span class="hud-label block tracking-widest">Enemies</span><span class="hud-value" id="hudEnemies">0</span></div>
    <div class="hud-card min-w-0"><span class="hud-label block tracking-widest">Power-ups</span><span class="hud-value" id="hudPower">B 1 · F 2 · SPD 0</span></div>
  </section>

  <main class="game-shell relative overflow-hidden" id="gameShell">
    <div class="canvas-wrap relative" id="canvasWrap">
      <canvas id="gameCanvas" width="780" height="660" aria-label="Bummer Man arena game canvas"></canvas>
      <div class="touch-controls" id="touchControls" aria-label="Touch game controls">
        <div class="stick-zone" id="joystick" aria-label="Movement joystick" role="application">
          <div class="stick-knob" id="stickKnob"></div>
        </div>
        <button class="bomb-touch" id="bombTouch" aria-label="Drop bomb">💣</button>
      </div>
    </div>
  </main>
  <div class="overlay show" id="screenLayer" role="dialog" aria-modal="true" aria-label="Game menu"></div>
  <button id="landscapeHome" class="icon-btn" aria-label="Exit to main menu" title="Exit to main menu">🚪</button>

<script>
(() => {

    'Ancient Stone Citadel','Volcanic Foundry','Arctic Research Base','Cyberpunk Megacity','Underwater Dome','Sky Temple','Roman Colosseum','Desert Pyramid','Rainforest Ruins','Industrial Dockyard',
    'Neon Metro','Crystal Palace','Moon Base','Alien Biosphere','Clockwork Factory','Royal Marble Palace','Viking Fortress','Floating Islands','Deep Sea Trench','Bioluminescent Forest',
    'Space Station','Sunken Temple','Dragon Keep','Obsidian Fortress','Aurora Observatory','Steampunk Airship','Magma Cathedral','Solar Farm','Quantum Laboratory','Celestial Gardens'
  ];
  const themes=[
    makeTheme('simple-0',simpleThemeNames[0],145,'simple','Simple Realistic'),
    makeTheme('real3d-0',realistic3DNames[0],28,'3d','3D Realistic'),

  const skins = [
    {id:'classic',name:'Classic Cyber Bot',milestone:0,body:'#21c9dc',dark:'#087b9a',visor:'#d9fbff',accent:'#91fffb',icon:'🤖'},
    {id:'shadow',name:'Shadow Stealth Ninja',milestone:5,body:'#333d54',dark:'#111827',visor:'#ff456c',accent:'#b6c5d8',icon:'🥷'},
    {id:'shogun',name:'Golden Shogun',milestone:10,body:'#e1a936',dark:'#8e4b16',visor:'#fff0a7',accent:'#ffdb65',icon:'👑'},
    {id:'plasma',name:'Crimson Plasma Knight',milestone:15,body:'#e74e62',dark:'#791c38',visor:'#ffd9dc',accent:'#ff8793',icon:'🦾'},
    {id:'void',name:'Cosmic Void Alien',milestone:20,body:'#8d6de9',dark:'#39256e',visor:'#d3c0ff',accent:'#70f4ff',icon:'👽'},
    {id:'diamond',name:'Celestial Diamond Hero',milestone:25,body:'#b8f6ff',dark:'#388bb4',visor:'#ffffff',accent:'#9cffff',icon:'💎'}
  ];
  const POWER_TYPES = ['bomb','flame','speed','life'];
  const SAVE_KEY = 'bummerManUnlimitedArena_v2';
  const saved = loadSave();
  const state = {
    mode:'menu', level:1, lives:3, score:0, bestScore:saved.bestScore||0,
    maxCompletedLevel:saved.maxCompletedLevel||0,

    currentSkin:saved.currentSkin||'classic', unlockedThemes:new Set(saved.unlockedThemes&&saved.unlockedThemes.length?saved.unlockedThemes:['simple-0','real3d-0']), selectedThemeId:saved.selectedThemeId||'simple-0', generatedThemes:Math.max(0,saved.generatedThemes||0), themeAutoCycle:saved.themeAutoCycle!==false, grid:[], player:null, enemies:[], bombs:[], explosions:new Map(),
    particles:[], powerups:[], exit:{x:11,y:9,revealed:false}, portalActive:false,
    bombCapacity:1, flameRange:2, speedBoostUntil:0, lastTime:0, now:0,
    cameraZoom:false, soundOn:true, touchEnabled:true, joystick:{x:0,y:0,active:false,pointerId:null},
    ad:null, adReturnMode:'menu', vaultReturnMode:'menu', completedThisLevel:false,
    currentTheme:themes[0], lastHud:0, message:'', messageUntil:0, touchDevice:('ontouchstart' in window)||(navigator.maxTouchPoints>0)
  };

  function loadSave(){try{const current=localStorage.getItem(SAVE_KEY);if(current)return JSON.parse(current)||{};const legacy=localStorage.getItem('bummerManUnlimitedArena_v1');return legacy?JSON.parse(legacy)||{}:{};}catch(_){return {}}}
  function save(){
    try{localStorage.setItem(SAVE_KEY,JSON.stringify({bestScore:state.bestScore,maxCompletedLevel:state.maxCompletedLevel,unlockedSkins:[...state.unlockedSkins],currentSkin:state.currentSkin,unlockedThemes:[...state.unlockedThemes],selectedThemeId:state.selectedThemeId,generatedThemes:state.generatedThemes,themeAutoCycle:state.themeAutoCycle}));}catch(_){/* storage may be unavailable */}
    document.getElementById('bestScore').textContent=state.bestScore.toLocaleString();
  }
  function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
  function randInt(n){return Math.floor(Math.random()*n)}
  function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=randInt(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];}return arr}
  function key(x,y){return x+','+y}
  function skin(){return skins.find(s=>s.id===state.currentSkin)||skins[0]}
  function unlockedThemeList(){return [...state.unlockedThemes].map(findTheme);}
  function currentTheme(){const selected=findTheme(state.selectedThemeId);if(!state.themeAutoCycle)return selected;const list=unlockedThemeList();const at=Math.max(0,list.findIndex(t=>t.id===selected.id));return list[(at+state.level-1)%Math.max(1,list.length)]||selected;}
  function setMessage(text,duration=1400){state.message=text;state.messageUntil=state.now+duration/1000}

  // ------------------------------ Audio ----------------------------------
  let toneReady=false, synth=null, bass=null, noise=null;
  async function initAudio(){
    if(!state.soundOn)return;
    try{
      if(window.Tone){await Tone.start();if(!toneReady){synth=new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:.005,decay:.12,sustain:.05,release:.18},volume:-10}).toDestination();bass=new Tone.MembraneSynth({pitchDecay:.04,octaves:4,envelope:{attack:.001,decay:.28,sustain:0,release:.22},volume:-8}).toDestination();noise=new Tone.NoiseSynth({noise:{type:'brown'},envelope:{attack:.001,decay:.2,sustain:0},volume:-18}).toDestination();toneReady=true;}Tone.Destination.mute=false;}
    }catch(_){/* audio is optional when browser blocks sound */}
  }
  function sfx(type){
    if(!state.soundOn||!toneReady)return;
    try{
      const t=Tone.now();
      if(type==='bomb'){synth.triggerAttackRelease('C3','16n',t);}
      else if(type==='blast'){bass.triggerAttackRelease('C1','8n',t);noise.triggerAttackRelease('8n',t+.015);}
      else if(type==='pickup'){synth.triggerAttackRelease('E6','16n',t);synth.triggerAttackRelease('A6','16n',t+.09);}
      else if(type==='hit'){synth.triggerAttackRelease('C2','8n',t);}
      else if(type==='level'){synth.triggerAttackRelease('C5','8n',t);synth.triggerAttackRelease('E5','8n',t+.12);synth.triggerAttackRelease('G5','4n',t+.24);}
    }catch(_){/* ignore timing/audio context errors */}
  }

  // ------------------------------ UI -------------------------------------
  function showOverlay(html){screenLayer.innerHTML=html;screenLayer.classList.add('show');}
  function hideOverlay(){screenLayer.classList.remove('show');screenLayer.innerHTML='';}
  function menuMarkup(){
    const next=Math.max(1,state.maxCompletedLevel+1),t=findTheme(state.selectedThemeId);
    return `<section class="home-panel"><div class="home-hero"><div><div class="eyebrow">GamerKie original · endless arena</div><h2 class="home-title">BUMMER MAN<br><span>UNLIMITED ARENA</span></h2><p class="home-sub">Blast your way through living worlds. Choose your arena, master every level and build your own endless theme collection.</p><div class="home-stats"><span class="home-stat">BEST <b>${state.bestScore.toLocaleString()}</b></span><span class="home-stat">NEXT <b>LEVEL ${next}</b></span><span class="home-stat">SKINS <b>${state.unlockedSkins.size}/6</b></span></div></div><div class="home-art" aria-hidden="true">💣</div></div><div class="home-actions"><button class="action-btn primary" data-action="start">▶ &nbsp; PLAY NOW · LEVEL ${next}</button><button class="action-btn secondary" data-action="levels">▦ &nbsp; LEVELS</button><button class="action-btn secondary" data-action="themes">🌍 &nbsp; THEMES</button><button class="action-btn secondary" data-action="vault">🦸 &nbsp; HERO SKINS</button><button class="action-btn secondary" data-action="share">📤 &nbsp; SHARE</button><button class="action-btn secondary" data-action="settings">⚙ &nbsp; SETTINGS</button><button class="action-btn secondary" data-action="fullscreen">⛶ &nbsp; FULLSCREEN</button></div><div class="control-help"><span>PC: WASD / ARROWS · SPACE / ENTER BOMB · P / ESC PAUSE</span><span>Mobile: landscape · left joystick · bomb button</span></div><p class="status-line">Selected arena: <strong style="color:#fff">${t.name}</strong> · ${state.unlockedThemes.size} themes unlocked</p></section>`;
  }
  function returnToMenu(){state.mode='menu';showMainMenu();}
  function renderLevels(){

    showOverlay(`<section class="library-panel"><div class="library-head"><div><div class="eyebrow">Progress map</div><h2>Choose Level</h2><p>Complete a level to unlock the next arena. Your best progress is saved.</p></div><button class="action-btn secondary" data-action="menu">✕</button></div><div class="library-scroll"><div class="level-grid">${cards}</div><div class="home-stats"><span class="home-stat">UNLOCKED THROUGH <b>LEVEL ${max}</b></span><span class="home-stat">BEST SCORE <b>${state.bestScore.toLocaleString()}</b></span></div></div></section>`);
    state.mode='levels';
  }
  function themeCard(t){
    const unlocked=state.unlockedThemes.has(t.id),selected=state.selectedThemeId===t.id;
    const action=unlocked?'selectTheme':'unlockTheme',label=unlocked?(selected?'✓ SELECTED':'USE THEME'):'🔒 WATCH AD · UNLOCK';
    return `<article class="theme-card"><div class="theme-preview" style="background:linear-gradient(145deg,${t.wallTop},${t.floor},${t.bg})"></div><div><div class="theme-name">${t.name}</div><div class="theme-type">${t.category}${t.style==='3d'?' · depth + lighting':' · natural textures'}</div></div><button class="action-btn ${unlocked?'secondary':'gold'}" data-action="${action}" data-theme="${t.id}">${label}</button></article>`;
  }
  function renderThemes(){
    const simple=themes.filter(t=>t.style==='simple'),three=themes.filter(t=>t.style==='3d');

  function renderSettings(){
    showOverlay(`<section class="panel"><div class="eyebrow">Game preferences</div><h2>Settings</h2><p class="panel-copy">Adjust the arena experience. These options save on this device.</p><div class="settings-row"><span>Automatic theme rotation</span><button class="action-btn secondary" data-action="autoThemes">${state.themeAutoCycle?'ON':'OFF'}</button></div><div class="settings-row"><span>Sound effects</span><button class="action-btn secondary" data-action="soundSetting">${state.soundOn?'ON':'OFF'}</button></div><div class="settings-row"><span>Touch controls</span><button class="action-btn secondary" data-action="touchSetting">${state.touchEnabled?'ON':'OFF'}</button></div><div class="menu-actions"><button class="action-btn secondary" data-action="menu">← Back to home</button></div></section>`);

  async function enterFullscreen(){

      const request=target.requestFullscreen||target.webkitRequestFullscreen;
      if(request){await request.call(target);try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');setTimeout(refreshArenaLayout,220);}catch(_){/* orientation lock is browser/device dependent */}return true;}

  function startAd(kind,targetId){

    showOverlay(`<section class="panel"><div class="eyebrow">Rewarded video · Demo</div><h2>${kind==='unlock'?'Unlock your new hero':kind==='theme'?'Unlock this new world':'Emergency revive'}</h2><p class="panel-copy">This is a simulated in-game reward ad, not a real advertisement. One completed demo unlocks one theme permanently.</p><div class="ad-box"><div class="ad-label">Reward sequence</div><div class="ad-count" id="adCount">3</div><div class="ad-track"><div class="ad-progress" id="adProgress"></div></div><div class="ad-foot">Please keep this panel open until the demo completes.</div></div><p class="status-line">Reward will be granted automatically.</p></section>`);
  }
  function updateAd(dt){
    if(!state.ad)return;

  // ------------------------------ Level generation -----------------------
  function buildLevel(level){
    const grid=Array.from({length:ROWS},(_,y)=>Array.from({length:COLS},(_,x)=>{
      if(x===0||y===0||x===COLS-1||y===ROWS-1)return 1;
      if(x%2===0&&y%2===0)return 1;

      ctx.fillStyle='#080808';ctx.beginPath();ctx.arc(0,1,16,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#555';ctx.lineWidth=3;ctx.stroke();
      ctx.fillStyle='#555';ctx.fillRect(-8,-9,7,5);ctx.fillStyle='#ddd';ctx.fillRect(-7,-8,4,3);
      ctx.strokeStyle='#3c2414';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(3,-13);ctx.lineTo(8,-20);ctx.stroke();
      const spark=Math.sin(state.now*24+b.x)*.5+.5;ctx.fillStyle=spark>.45?'#fff36a':'#ff7a24';ctx.fillRect(7,-23,6,6);ctx.fillStyle='#fff';ctx.fillRect(9,-25,2,3);ctx.restore();
    }
  }
  function drawExplosions(t){
    for(const [k,expiry] of state.explosions){const [x,y]=k.split(',').map(Number);const left=clamp((expiry-state.now)/.48,0,1);const px=ORIGIN_X+x*TILE,py=ORIGIN_Y+y*TILE;
      ctx.save();ctx.globalAlpha=left;ctx.fillStyle='#f33b18';ctx.fillRect(px+3,py+3,TILE-6,TILE-6);ctx.fillStyle='#ff8b22';ctx.fillRect(px+9,py+5,TILE-18,TILE-10);ctx.fillStyle='#fff07a';ctx.fillRect(px+17,py+8,TILE-34,TILE-16);ctx.fillStyle='#fff';ctx.fillRect(px+TILE/2-5,py+TILE/2-5,10,10);ctx.restore();
    }
  }
  function drawHero(x,y,skinData,anim,face,invuln=false){
    ctx.save();ctx.translate(Math.round(x),Math.round(y));if(invuln&&Math.floor(state.now*12)%2===0)ctx.globalAlpha=.38;
    const step=Math.floor(anim*2)%2;ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(-13,17,27,5);
    // boots and legs
    ctx.fillStyle='#101b3a';ctx.fillRect(-10,10,8,10);ctx.fillRect(3+(step?2:0),10,8,10);ctx.fillStyle='#f2f2f2';ctx.fillRect(-11,17,10,4);ctx.fillRect(3+(step?2:0),17,10,4);
    // blue body and arms
    ctx.fillStyle='#0759b7';ctx.fillRect(-12,-7,24,21);ctx.fillStyle='#1688ed';ctx.fillRect(-9,-8,18,17);ctx.fillStyle='#f4f4f4';ctx.fillRect(-16,-5,5,14);ctx.fillRect(11,-5,5,14);
    // classic white helmet
    ctx.fillStyle='#161616';ctx.fillRect(-13,-23,27,17);ctx.fillStyle='#f4f4f4';ctx.fillRect(-12,-24,24,16);ctx.fillStyle='#fff';ctx.fillRect(-8,-27,16,5);ctx.fillStyle='#b8c7cf';ctx.fillRect(-10,-11,20,3);
    ctx.fillStyle='#078cda';ctx.fillRect(-8,-19,16,7);ctx.fillStyle='#fff';ctx.fillRect(face>=0?3:-7,-18,4,4);ctx.fillStyle='#17212b';ctx.fillRect(face>=0?4:-6,-18,2,3);
    ctx.fillStyle=skinData.accent;ctx.fillRect(-3,-5,6,3);ctx.restore();
  }
  function drawEnemy(e,index){
    const x=Math.round(ORIGIN_X+e.x*TILE),y=Math.round(ORIGIN_Y+e.y*TILE);ctx.save();ctx.translate(x,y);const bob=Math.round(Math.sin(e.anim)*1.5);ctx.translate(0,bob);
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(-14,16,29,5);
    const orange=e.smart?'#f5a22d':'#f58b2b';ctx.fillStyle='#8e3b12';ctx.fillRect(-15,-5,30,21);ctx.fillRect(-11,-12,22,12);ctx.fillStyle=orange;ctx.fillRect(-14,-7,28,20);ctx.fillRect(-11,-13,22,8);ctx.fillRect(-7,-17,14,5);
    ctx.fillStyle='#ffbf65';ctx.fillRect(-9,-9,18,5);ctx.fillStyle='#171717';ctx.fillRect(-8,-2,5,7);ctx.fillRect(4,-2,5,7);ctx.fillStyle='#fff';ctx.fillRect(-7,-2,2,2);ctx.fillRect(5,-2,2,2);
    ctx.fillStyle='#9b4318';ctx.fillRect(-11,12,7,5);ctx.fillRect(4,12,7,5);ctx.fillStyle='#f5a34b';ctx.fillRect(-10,7,20,3);
    if(e.smart){ctx.fillStyle='#fff36a';ctx.fillRect(-3,-16,6,3);}ctx.restore();
  }
  function drawParticles(){for(const p of state.particles){ctx.save();ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(ORIGIN_X+p.x*TILE,ORIGIN_Y+p.y*TILE,p.size,0,Math.PI*2);ctx.fill();ctx.restore();}}
  function drawArena(){
    const t=state.currentTheme;ctx.fillStyle=t.bg;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.imageSmoothingEnabled=true;
    const zoom=state.cameraZoom?1.32:1;let camX=ORIGIN_X,camY=ORIGIN_Y;
    if(state.cameraZoom&&state.player){const px=ORIGIN_X+state.player.x*TILE,py=ORIGIN_Y+state.player.y*TILE;camX=canvas.width/2-px*zoom;camY=canvas.height/2-py*zoom;const minX=canvas.width- (ORIGIN_X+BOARD_W)*zoom,maxX=-ORIGIN_X*zoom;const minY=canvas.height-(ORIGIN_Y+BOARD_H)*zoom,maxY=-ORIGIN_Y*zoom;camX=clamp(camX,minX,maxX);camY=clamp(camY,minY,maxY);}
    ctx.save();ctx.translate(camX,camY);ctx.scale(zoom,zoom);
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const px=ORIGIN_X+x*TILE,py=ORIGIN_Y+y*TILE;drawFloor(px,py,t);}
    // Portal is rendered underneath crates, becoming visible once its crate is removed.
    drawPortal(t);
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){if(state.grid[y][x]===1)drawWall(x,y,t);else if(state.grid[y][x]===2)drawCrate(x,y,t);}
    drawPowerups();drawBombs(t);drawExplosions(t);
    state.enemies.forEach(drawEnemy);
    if(state.player)drawHero(ORIGIN_X+state.player.x*TILE,ORIGIN_Y+state.player.y*TILE,skin(),state.player.anim,state.player.face,state.player.invuln>0);
    drawParticles();
    ctx.restore();
    // Edge frame and objective indicator.
    ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.strokeRect(ORIGIN_X-3,ORIGIN_Y-3,BOARD_W+6,BOARD_H+6);
    if(isWideArena&&document.fullscreenElement){
      ctx.save();ctx.fillStyle='rgba(4,13,24,.76)';roundedRect(ctx,ORIGIN_X,5,BOARD_W,23,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1;ctx.stroke();
      ctx.font='bold 12px system-ui';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle='#ffffff';
      ctx.fillText(`LEVEL ${state.level}`,ORIGIN_X+9,16);ctx.fillStyle=t.accent;ctx.fillText(t.name,ORIGIN_X+90,16);
      ctx.textAlign='right';ctx.fillStyle='#fff';ctx.fillText(`❤️ ${state.lives}   🏆 ${state.score.toLocaleString()}   👾 ${state.enemies.length}`,ORIGIN_X+BOARD_W-9,16);ctx.restore();
    }
    if(state.message&&state.now<state.messageUntil){ctx.save();ctx.font='900 15px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';const w=ctx.measureText(state.message).width+38;ctx.fillStyle='rgba(3,12,22,.78)';roundedRect(ctx,canvas.width/2-w/2,34,w,34,12);ctx.fill();ctx.strokeStyle='rgba(99,226,245,.5)';ctx.stroke();ctx.fillStyle='#e9fcff';ctx.fillText(state.message,canvas.width/2,51);ctx.restore();}
    if(state.mode==='menu'){drawDemoBackdrop();}
  }
  function drawDemoBackdrop(){
    // Subtle decorative sparks in the idle arena keep the start screen alive.
    for(let i=0;i<14;i++){const x=(i*73+state.now*12)%canvas.width,y=(i*47+Math.sin(state.now+i)*12)%canvas.height;ctx.fillStyle='rgba(111,218,242,.22)';ctx.fillRect(x,y,2,2);}
  }
  function frame(ts){
    const dt=state.lastTime?Math.min((ts-state.lastTime)/1000,.05):0;state.lastTime=ts;update(dt);drawArena();requestAnimationFrame(frame);
  }

  // ------------------------------ Inputs ---------------------------------
  const keys={up:false,down:false,left:false,right:false};
  window.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' ','enter'].includes(k))e.preventDefault();
    if(k==='w'||k==='arrowup')keys.up=true;if(k==='s'||k==='arrowdown')keys.down=true;if(k==='a'||k==='arrowleft')keys.left=true;if(k==='d'||k==='arrowright')keys.right=true;
    if((k===' '||k==='enter')&&!e.repeat){initAudio();dropBomb();}
    if((k==='p'||k==='escape')&&!e.repeat){if(state.mode==='play')openPause();else if(state.mode==='pause'){state.mode='play';hideOverlay();updateTouchControls();}}
  },{passive:false});
  window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=false;if(k==='s'||k==='arrowdown')keys.down=false;if(k==='a'||k==='arrowleft')keys.left=false;if(k==='d'||k==='arrowright')keys.right=false;});
  window.addEventListener('blur',()=>{keys.up=keys.down=keys.left=keys.right=false;if(state.mode==='play')openPause();});
  function updateTouchControls(){touchControls.classList.toggle('visible',state.touchDevice&&state.touchEnabled&&state.mode==='play');}
  function joystickPoint(e){const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.34,mag=Math.hypot(dx,dy);if(mag>max){dx=dx/mag*max;dy=dy/mag*max;}state.joystick.x=dx/max;state.joystick.y=dy/max;stickKnob.style.transform=`translate(${dx}px,${dy}px)`;}
  joystick.addEventListener('pointerdown',e=>{if(!touchControls.classList.contains('visible'))return;initAudio();joystick.setPointerCapture(e.pointerId);state.joystick.active=true;state.joystick.pointerId=e.pointerId;joystickPoint(e);e.preventDefault();});
  joystick.addEventListener('pointermove',e=>{if(state.joystick.active&&e.pointerId===state.joystick.pointerId){joystickPoint(e);e.preventDefault();}});
  function stopStick(e){if(state.joystick.active&&(e.pointerId===undefined||e.pointerId===state.joystick.pointerId)){state.joystick.active=false;state.joystick.pointerId=null;state.joystick.x=state.joystick.y=0;stickKnob.style.transform='translate(0px,0px)';}}
  joystick.addEventListener('pointerup',stopStick);joystick.addEventListener('pointercancel',stopStick);joystick.addEventListener('lostpointercapture',stopStick);
  document.getElementById('bombTouch').addEventListener('pointerdown',e=>{e.preventDefault();initAudio();dropBomb();});

  // ------------------------------ Buttons --------------------------------
  document.getElementById('themesBtn').addEventListener('click',()=>{initAudio();openThemes();});
  document.getElementById('skinsBtn').addEventListener('click',()=>{initAudio();openVault();});
  document.getElementById('zoomBtn').addEventListener('click',()=>{state.cameraZoom=!state.cameraZoom;updateHud();});
  document.getElementById('soundBtn').addEventListener('click',async()=>{state.soundOn=!state.soundOn;if(state.soundOn)await initAudio();else if(window.Tone&&Tone.Destination)Tone.Destination.mute=true;updateHud();});
  document.getElementById('fullscreenBtn').addEventListener('click',async()=>{if(document.fullscreenElement)await exitFullscreen();else await enterFullscreen();});
  document.getElementById('fullscreenExit').addEventListener('click',exitFullscreen);
  document.getElementById('landscapeHome').addEventListener('click',async()=>{await exitFullscreen();showMainMenu();});
  document.getElementById('shareBtn').addEventListener('click',shareGame);
  document.addEventListener('fullscreenchange',()=>{const b=document.getElementById('fullscreenBtn');if(b){b.textContent=document.fullscreenElement?'⤢':'⛶';b.title=document.fullscreenElement?'Exit fullscreen':'Fullscreen';b.setAttribute('aria-label',b.title);}const homeFull=document.querySelector('[data-action=fullscreen]');if(homeFull)homeFull.textContent=document.fullscreenElement?'⤢ EXIT FULLSCREEN':'⛶ FULLSCREEN';});
  document.getElementById('pauseBtn').addEventListener('click',()=>openPause());
  document.getElementById('exitBtn').addEventListener('click',async()=>{await exitFullscreen();showMainMenu();});

  screenLayer.addEventListener('click',e=>{
    const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const action=btn.dataset.action,skinId=btn.dataset.skin;initAudio();
    if(action==='start'){enterFullscreen();state.lives=3;state.score=0;startLevel(Math.max(1,state.maxCompletedLevel+1));}
    else if(action==='levels'){renderLevels();}
    else if(action==='themes'){openThemes();}
    else if(action==='settings'){renderSettings();}
    else if(action==='share'){shareGame();}
    else if(action==='fullscreen'){if(document.fullscreenElement)exitFullscreen();else enterFullscreen();}
    else if(action==='chooseLevel'){const n=Math.max(1,Math.floor(Number(btn.dataset.level)||1));enterFullscreen();state.lives=3;state.score=0;startLevel(n);}
    else if(action==='selectTheme'){const id=btn.dataset.theme;if(state.unlockedThemes.has(id)){state.selectedThemeId=id;state.currentTheme=currentTheme();save();updateHud();renderThemes();}}
    else if(action==='unlockTheme'){const id=btn.dataset.theme;if(id&&!state.unlockedThemes.has(id))startAd('theme',id);}
    else if(action==='themesClose'){if(state.themeReturnMode==='play'){state.mode='play';hideOverlay();updateTouchControls();}else showMainMenu();}
    else if(action==='autoThemes'){state.themeAutoCycle=!state.themeAutoCycle;save();renderSettings();}
    else if(action==='soundSetting'){state.soundOn=!state.soundOn;if(state.soundOn)initAudio();else if(window.Tone&&Tone.Destination)Tone.Destination.mute=true;save();renderSettings();}
    else if(action==='touchSetting'){state.touchEnabled=!state.touchEnabled;save();renderSettings();}
    else if(action==='resume'){state.mode='play';hideOverlay();updateTouchControls();}
    else if(action==='restart'){startLevel(state.level);}
    else if(action==='restartRun'){state.lives=3;state.score=0;startLevel(1);}
    else if(action==='next'){startLevel(state.level+1);}
    else if(action==='menu'){showMainMenu();}
    else if(action==='exit'){exitFullscreen();showMainMenu();}
    else if(action==='vault'){openVault();}
    else if(action==='vaultClose'){const back=state.vaultReturnMode;hideOverlay();if(back==='menu'){showMainMenu();}else if(back==='pause'){state.mode='play';openPause();}else if(back==='complete'){showLevelComplete();}else if(back==='gameover'){showGameOver();}else{state.mode=back==='play'?'play':'menu';if(state.mode==='menu')showMainMenu();else updateTouchControls();}}
    else if(action==='equip'){if(state.unlockedSkins.has(skinId)){state.currentSkin=skinId;save();renderVault();}}
    else if(action==='unlockSkin'){const s=skins.find(v=>v.id===skinId);if(s&&state.maxCompletedLevel>=s.milestone&&!state.unlockedSkins.has(skinId))startAd('unlock',skinId);}
    else if(action==='revive'){startAd('revive');}
    else if(action==='touchToggle'){state.touchEnabled=!state.touchEnabled;renderPause();}
    else if(action==='locked'){setMessage('Clear the milestone level to unlock this reward');}
  });

  // ------------------------------ Boot -----------------------------------
  state.currentTheme=currentTheme();
  // Build a quiet preview arena behind the menu without starting a run.
  const preview=buildLevel(1);state.grid=preview.grid;state.exit=preview.exit;state.enemies=preview.enemies;state.player={x:1.5,y:1.5,invuln:0,anim:0,face:1};state.mode='menu';
  save();updateHud();showMainMenu();updateTouchControls();requestAnimationFrame(frame);
  // Expose pure, read-only diagnostics for automated smoke checks; gameplay remains private.
  window.__BUMMER_ARENA_TEST__={buildLevel,skins,themes,generatedTheme,get state(){return {level:state.level,mode:state.mode,enemies:state.enemies.length,exit:{...state.exit},theme:state.currentTheme.name,unlockedThemes:[...state.unlockedThemes],generatedThemes:state.generatedThemes,wideArena:isWideArena,columns:COLS,rows:ROWS,bombs:state.bombs.length};}};
})();
</script>
</body>
